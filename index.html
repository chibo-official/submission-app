<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>千房 提出物管理（誤打伝票）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--red:#942343;--red-d:#7A1C38;--red-l:#F3E3E8;--grey:#B5B5B6;--bg:#F6F3F1;--line:#D9D2D5;--ink:#2A2527;--sub:#6B5F63;--ok:#2E7D4F;--warn:#B26A00;--blue:#2F5F9E}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans JP',-apple-system,'Hiragino Sans',sans-serif;font-size:15px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
.top{background:var(--red);color:#fff;padding:12px 16px calc(12px);display:flex;align-items:center;gap:12px;padding-top:max(12px,env(safe-area-inset-top))}
.top .t{flex:1;min-width:0}
.top .s{font-size:12px;opacity:.9}
.top h1{margin:0;font-size:18px;font-weight:700}
.top .back,.top .out{background:transparent;border:1px solid rgba(255,255,255,.6);color:#fff;border-radius:8px;padding:6px 12px;min-height:36px;cursor:pointer}
.wrap{max-width:1180px;margin:0 auto;padding:14px 16px 90px}
.narrow{max-width:560px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.lbl{font-size:12px;color:var(--sub);margin-bottom:2px}
.req{color:var(--red);font-weight:700}
.field{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.field select,.field input,.field textarea{width:100%;border:0;outline:0;background:transparent;font-size:16px;font-weight:500;padding:2px 0;min-height:28px}
.field textarea{resize:vertical;min-height:84px;font-weight:400}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.stack{display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.opt{min-height:52px;display:flex;align-items:center;justify-content:center;text-align:center;background:#fff;border:1px solid var(--line);border-radius:8px;padding:4px 8px;cursor:pointer;font-size:14px}
.opt.on{background:var(--red-l);border:2px solid var(--red);color:var(--red-d);font-weight:700}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.ph{height:110px;border-radius:8px;border:2px dashed var(--red);display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;font-weight:700;color:var(--red);cursor:pointer;overflow:hidden;position:relative;background:#fff;padding:4px}
.ph.has{border:1px solid var(--line);padding:0}
.ph img{width:100%;height:100%;object-fit:cover}
.ph .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-size:11px;font-weight:400;padding:2px 4px}
.ph input{display:none}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 18px;border-radius:8px;border:2px solid var(--red);background:#fff;color:var(--red);font-weight:700;font-size:15px;cursor:pointer}
.btn.pri{background:var(--red);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn[disabled]{opacity:.5;cursor:default}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center;z-index:5}
.bar .btn{flex:1;max-width:280px}
.badge{display:inline-block;border-radius:999px;padding:1px 10px;font-size:12px;font-weight:700;color:#fff;background:var(--grey);white-space:nowrap}
.b-pending{background:var(--warn)}.b-returned{background:var(--red)}.b-received{background:var(--blue)}.b-confirmed{background:var(--ok)}.b-over{background:#fff;color:var(--red);border:1px solid var(--red)}
.alert{border-radius:8px;padding:10px 12px;font-size:14px;background:var(--red-l);border:1px solid var(--red);color:var(--red-d)}
.alert.info{background:#fff;border-color:var(--line);color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.tile{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;min-height:96px;text-align:left;cursor:pointer;position:relative}
.tile.pri{background:var(--red);color:#fff;border-color:var(--red)}
.tile.off{opacity:.55;cursor:default}
.tile .n{font-size:17px;font-weight:700}.tile .d{font-size:12px;opacity:.85;margin-top:2px}
.tile .c{position:absolute;right:12px;top:12px;background:var(--red);color:#fff;border-radius:999px;min-width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-weight:700;padding:0 8px}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.item.sel{border:2px solid var(--red)}
.item .a{display:flex;gap:8px;align-items:center;justify-content:space-between}
.item .t{font-weight:700}.item .m{font-size:13px;color:var(--sub);margin-top:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:14px}.kv .k{color:var(--sub)}
.split{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media print{body *{visibility:hidden}#printArea,#printArea *{visibility:visible}#printArea{position:absolute;left:0;top:0;width:100%;padding:12px}#printArea .tl{overflow:visible}#printArea table{font-size:9px}.toast{display:none}}
#printArea{display:none}@media print{#printArea{display:block}}
@media(min-width:900px){.split{grid-template-columns:minmax(0,420px) minmax(0,1fr)}.split.wide{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}.hide-wide{display:none}}
@media(max-width:899px){.split .pane-detail:not(.on){display:none}.split.has-sel .pane-list{display:none}}
table{width:100%;border-collapse:collapse;background:#fff;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid #ECE8EA;text-align:left;white-space:nowrap}
th{background:#FBF9F8;font-size:12px;color:var(--sub);position:sticky;top:0}
tr.row-i{cursor:pointer}tr.row-i:hover{background:#FBF4F6}tr.sel td{background:var(--red-l)}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.sum .card .n{font-size:24px;font-weight:700}.sum .card .l{font-size:12px;color:var(--sub)}
.hist{font-size:13px;border-left:3px solid var(--line);padding-left:10px;display:flex;flex-direction:column;gap:6px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.ov .box{background:#fff;border-radius:12px;padding:16px;width:100%;max-width:440px;display:flex;flex-direction:column;gap:12px}
.ov img.big{max-width:100%;max-height:88vh;border-radius:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;background:#2A2527;color:#fff;border-radius:8px;padding:10px 16px;z-index:30;font-size:14px;max-width:90vw}
.demo{border:1px dashed var(--grey);border-radius:8px;padding:10px 12px;font-size:13px;color:var(--sub);background:#fff}
.tl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff;max-height:70vh}
.dn{display:grid;grid-template-columns:64px 1fr 110px;gap:8px;align-items:center;padding:3px 0;border-bottom:1px solid #F0ECEE}
.inp{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:16px;background:#fff;min-height:40px}
.dn .inp{text-align:right}
h2{font-size:16px;margin:0}
.sp{flex:1}
</style>
</head>
<body>
<div id="app"></div>
<div id="layer"></div><div id="printArea"></div>
<script src="config.js"></script>
<script src="core.js"></script>
<script src="xlsx.js"></script>
<script src="masters.js"></script>
<script src="api-demo.js"></script>
<script src="api-gas.js"></script>
<script src="app.js"></script>
</body>
</html>
